<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#23262B" media="(prefers-color-scheme: dark)" />
		<meta itemprop="name" content="RTDF" />
		<meta name="description" itemprop="description" content="Mobile web component library based on React and Tailwind" />
		<meta itemprop="image" content="/assets/favicon_logo/android-chrome-512x512.png" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="RTDF - 移动 web 组件库" />
		<meta property="og:description" content="Mobile web component library based on React and Tailwind" />
		<meta property="og:url" content="https://rtdf.dev/" />
		<meta property="og:image" content="https://rtdf.dev/assets/favicon_logo/android-chrome-512x512.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="RTDF - 移动 web 组件库" />
		<meta name="twitter:description" content="Mobile web component library based on React and Tailwind" />
		<meta name="twitter:image" content="https://rtdf.dev/assets/favicon_logo/android-chrome-512x512.png" />
		<title>RTDF - 移动 web 组件库</title>
		<link href="/favicon.ico" rel="icon" type="image/x-icon" data-theme-favicon />
		<script>
			const savedMode = localStorage.getItem('theme');
			const initialTheme = ['auto', 'light', 'dark'].includes(savedMode) ? savedMode : 'auto';
			const initialMode = initialTheme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : initialTheme;
			document.querySelector('[data-theme-favicon]')?.setAttribute('href', initialMode === 'dark' ? '/favicon_black.ico' : '/favicon.ico');
		</script>
	</head>
	<body
		class="bg-bg-base dark:bg-bg-base-dark text-text-primary dark:text-text-dark selection:bg-primary dark:selection:bg-dark selection:text-white dark:selection:text-black"
	>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
