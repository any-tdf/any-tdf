<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vtdf.svg" data-theme-favicon />
		<script>
			const urlMode = new URLSearchParams(location.search).get('darkMode');
			const savedMode = localStorage.getItem('theme');
			const initialMode = urlMode === 'dark' || (urlMode !== 'light' && savedMode === 'dark') ? 'dark' : 'light';
			document.querySelector('[data-theme-favicon]')?.setAttribute('href', initialMode === 'dark' ? '/vtdf_dark.svg' : '/vtdf.svg');
		</script>
		<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
		<title>VTDF Demo</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
