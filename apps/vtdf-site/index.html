<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#23262B" media="(prefers-color-scheme: dark)" />
		<meta itemprop="name" content="VTDF" />
		<meta name="description" itemprop="description" content="Mobile web component library based on Vue and Tailwind" />
		<meta itemprop="image" content="/assets/favicon_logo/android-chrome-512x512.png" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="VTDF - 移动 web 组件库" />
		<meta property="og:description" content="Mobile web component library based on Vue and Tailwind" />
		<meta property="og:url" content="https://vtdf.dev/" />
		<meta property="og:image" content="https://vtdf.dev/assets/favicon_logo/android-chrome-512x512.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="VTDF - 移动 web 组件库" />
		<meta name="twitter:description" content="Mobile web component library based on Vue and Tailwind" />
		<meta name="twitter:image" content="https://vtdf.dev/assets/favicon_logo/android-chrome-512x512.png" />
		<title>VTDF - 移动 web 组件库</title>
		<link href="/favicon.ico" rel="icon" type="image/x-icon" data-theme-favicon />
		<script>
			// localStorage 可能被禁用（如隐私模式），读取需兜底
			// localStorage may be disabled (e.g. private mode), guard reads
			let savedMode = null;
			let savedLang = null;
			try {
				savedMode = localStorage.getItem('theme');
				savedLang = localStorage.getItem('lang');
			} catch {
				// 读取失败时按默认值处理 / fall back to defaults when reads fail
			}
			const initialTheme = ['auto', 'light', 'dark'].includes(savedMode) ? savedMode : 'auto';
			const initialMode = initialTheme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : initialTheme;
			// 首屏同步 data-mode 与 lang，亮色取值 light 与 App.vue 的 data-mode 保持一致
			// Sync data-mode and lang before first paint; light resolves to 'light' to match App.vue
			document.documentElement.setAttribute('data-mode', initialMode);
			const initialLang = savedLang ?? (navigator.language.startsWith('en') ? 'en_US' : 'zh_CN');
			document.documentElement.lang = initialLang === 'zh_CN' ? 'zh-CN' : 'en';
			document.querySelector('[data-theme-favicon]')?.setAttribute('href', initialMode === 'dark' ? '/favicon_black.ico' : '/favicon.ico');
		</script>
	</head>
	<body
		class="bg-bg-base dark:bg-bg-base-dark text-text-primary dark:text-text-dark selection:bg-primary dark:selection:bg-dark selection:text-white dark:selection:text-black"
	>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
