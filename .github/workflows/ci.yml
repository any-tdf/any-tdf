name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      routes: ${{ steps.scopes.outputs.routes }}
      browser: ${{ steps.scopes.outputs.browser }}
      publish: ${{ steps.scopes.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Detect changed CI scopes
        id: scopes
        env:
          CI_COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_COMPARISON_HEAD: ${{ github.sha }}
          CI_FORCE_FULL: ${{ github.event_name == 'push' }}
        run: bun run scripts/ci-changed-scopes.mjs

  affected-workspaces:
    name: Affected Workspaces
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record npm publish comparison base
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/base-sha"

      - name: Upload npm publish metadata
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publish-metadata
          path: ${{ runner.temp }}/base-sha
          retention-days: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify monorepo structure
        run: bun run verify:structure

      - name: Verify monorepo references and versions
        run: bun run verify:references

      - name: Verify Changeset release policy
        run: bun run verify:changesets

      - name: Verify generated files
        run: bun run generate:check

      - name: Check repository formatting
        run: bun run format:check

      - name: Lint repository
        run: bun run lint

      - name: Test CI scope detection
        run: bun test scripts/ci-changed-scopes.test.ts

      - name: Check affected Workspaces
        run: bunx turbo run check test verify:workspace build --affected

      - name: Verify packaged Demo routes
        if: needs.changes.outputs.routes == 'true'
        run: bun run verify:routes

  browser:
    name: Browser Verification
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify browser interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun run verify:browser

  publish-pack-check:
    name: Publish Pack Check
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test npm version detector and publisher
        run: bun run publish:npm:test

      - name: Dry-run npm packaging and consumer checks
        run: bun run publish:npm:pack:check
