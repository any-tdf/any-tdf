name: Publish One npm Package

# npm Trusted Publishing validates the calling workflow for workflow_call.
# Configure each npm package to trust publish-npm.yml, not this reusable workflow.
# npm settings: organization any-tdf, repository any-tdf, workflow publish-npm.yml,
# no environment, and allow npm publish.

on:
  workflow_call:
    inputs:
      package-name:
        description: Public npm package name
        required: true
        type: string
      package-version:
        description: Public npm package version
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        description: Temporary bootstrap token for publishing packages before Trusted Publishing is configured
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.package-name }}@${{ inputs.package-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js for npm provenance
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm Trusted Publishing requires npm >= 11.5.1; pinned to the exact
      # latest release (12.0.2) so the toolchain does not float.
      - name: Set up npm Trusted Publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish selected package
        env:
          EXPECTED_PACKAGE_VERSION: ${{ inputs.package-version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run publish:npm -- --package="${{ inputs.package-name }}"
