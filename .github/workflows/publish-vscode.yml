name: Publish VS Code Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tooling/vscode-extension/package.json

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared site data
        run: bun run --filter @any-tdf/site-common build

      - name: Verify synchronized extension files
        run: bun run --filter any-tdf-vscode-extension files:check

      - name: Run extension tests
        run: bun run --filter any-tdf-vscode-extension test

      - name: Check repository formatting and lint
        run: bun run quality:check

      - name: Package extension
        run: bun run --filter any-tdf-vscode-extension package

      - name: Publish extension
        run: bun run --filter any-tdf-vscode-extension publish -- -p "${{ secrets.VSCE_TOKEN }}"
