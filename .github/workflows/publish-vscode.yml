name: Publish VS Code Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - extensions/vscode-extension/package.json

permissions:
  contents: read

concurrency:
  group: publish-vscode-extension
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Marketplace version
        id: marketplace
        working-directory: extensions/vscode-extension
        run: bun run marketplace:check

      - name: Build shared data
        if: steps.marketplace.outputs.published != 'true'
        run: bun run --filter @any-tdf/common build && bun run --filter @any-tdf/site-common build

      - name: Verify synchronized extension files
        if: steps.marketplace.outputs.published != 'true'
        run: bun run --filter stdf-vscode-extension files:check

      - name: Run extension tests
        if: steps.marketplace.outputs.published != 'true'
        run: bun run --filter stdf-vscode-extension test

      - name: Check extension formatting
        if: steps.marketplace.outputs.published != 'true'
        run: bunx vp fmt --check --disable-nested-config extensions/vscode-extension/package.json extensions/vscode-extension/src extensions/vscode-extension/test

      - name: Lint extension
        if: steps.marketplace.outputs.published != 'true'
        run: bunx vp lint --disable-nested-config extensions/vscode-extension/src extensions/vscode-extension/test

      - name: Package extension
        if: steps.marketplace.outputs.published != 'true'
        run: bun run --filter stdf-vscode-extension package

      - name: Upload VSIX audit artifact
        if: steps.marketplace.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.marketplace.outputs['extension-id'] }}-${{ steps.marketplace.outputs.version }}
          path: extensions/vscode-extension/*.vsix
          if-no-files-found: error

      - name: Publish extension
        if: steps.marketplace.outputs.published != 'true'
        working-directory: extensions/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        # Reuse the audited VSIX produced by the package step (name/version from
        # extensions/vscode-extension/package.json). --packagePath skips packaging,
        # so --no-dependencies is unnecessary.
        run: bun run vsce publish --packagePath "stdf-vscode-extension-${{ steps.marketplace.outputs.version }}.vsix" --skip-duplicate
