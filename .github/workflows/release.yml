name: Create GitHub Releases

on:
  workflow_call:
    inputs:
      release-sha:
        description: Exact commit used to publish the packages
        required: true
        type: string
      packages-json:
        description: JSON list of published package names and versions
        required: true
        type: string
      release-key:
        description: Stable package coordinate used to isolate matrix concurrency
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release-sha:
        description: Commit or ref for the Release, defaulting to the selected workflow ref
        required: false
        type: string
      packages-json:
        description: JSON list such as [{"name":"stdf","version":"3.0.0"}]
        required: true
        type: string

concurrency:
  group: github-releases-${{ github.run_id }}-${{ inputs.release-key }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create Package Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-sha || github.sha }}
          fetch-depth: 0

      - name: Record release commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify GitHub Release notes
        run: bun run release:check

      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES_JSON: ${{ inputs.packages-json }}
          RELEASE_TARGET: ${{ steps.revision.outputs.sha }}
        run: bun run release
