name: Publish npm Packages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: publish-npm-packages
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  detect:
    name: Detect Changed Package Versions
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      all: ${{ steps.versions.outputs.all }}
      level0: ${{ steps.versions.outputs.level0 }}
      level1: ${{ steps.versions.outputs.level1 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download npm publish metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: npm-publish-metadata
          path: ${{ runner.temp }}/npm-publish-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve package comparison base
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            echo "base-sha=$(<"$RUNNER_TEMP/npm-publish-metadata/base-sha")" >> "$GITHUB_OUTPUT"
          else
            echo 'base-sha=' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify npm version detector and publisher
        run: bun run publish:npm:test

      - name: Detect package version changes
        id: versions
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base-sha }}
        run: bun run publish:npm:changed

  publish-level-0:
    name: Publish ${{ matrix.package.name }}@${{ matrix.package.version }}
    needs: detect
    if: needs.detect.outputs.level0 != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.level0) }}
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package-name: ${{ matrix.package.name }}
      package-version: ${{ matrix.package.version }}
    secrets: inherit

  publish-level-1:
    name: Publish ${{ matrix.package.name }}@${{ matrix.package.version }}
    needs:
      - detect
      - publish-level-0
    if: >-
      always() &&
      needs.detect.outputs.level1 != '[]' &&
      (needs.publish-level-0.result == 'success' || needs.publish-level-0.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.level1) }}
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package-name: ${{ matrix.package.name }}
      package-version: ${{ matrix.package.version }}
    secrets: inherit

  github-releases:
    name: Release ${{ matrix.package.name }}@${{ matrix.package.version }}
    needs:
      - detect
      - publish-level-0
      - publish-level-1
    if: >-
      always() &&
      needs.detect.outputs.all != '[]' &&
      (needs.publish-level-0.result == 'success' || needs.publish-level-0.result == 'skipped') &&
      (needs.publish-level-1.result == 'success' || needs.publish-level-1.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.all) }}
    uses: ./.github/workflows/release.yml
    with:
      packages-json: ${{ format('[{0}]', toJSON(matrix.package)) }}
    secrets: inherit
