name: Version npm Packages

on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
  workflow_dispatch:

concurrency:
  group: version-npm-packages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Open or Update Version PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare version branch
        env:
          VERSION_BRANCH: changeset-release/main
        run: git switch --force-create "$VERSION_BRANCH"

      - name: Version packages
        run: bun run version-packages

      - name: Push version branch and open or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BRANCH: changeset-release/main
          VERSION_COMMIT: 'chore: 发布软件包版本'
          VERSION_TITLE: 'chore: 发布软件包版本'
          VERSION_BODY: |-
            This pull request applies the pending Changesets and updates stable package versions.

            Changelog generation is intentionally disabled for this repository.
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No package version updates were generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --message "$VERSION_COMMIT"
          git push --force origin "HEAD:$VERSION_BRANCH"

          pr_number="$(gh pr list --base main --head "$VERSION_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$VERSION_TITLE" --body "$VERSION_BODY"
          else
            gh pr create --base main --head "$VERSION_BRANCH" --title "$VERSION_TITLE" --body "$VERSION_BODY"
          fi
