name: Build Site Artifacts

on:
  pull_request:
    paths:
      - apps/**
      - content/**
      - packages/common/**
      - packages/stdf/**
      - packages/rtdf/**
      - packages/vtdf/**
      - bun.lock
      - package.json
      - turbo.json
  push:
    branches:
      - main
    paths:
      - apps/**
      - content/**
      - packages/common/**
      - packages/stdf/**
      - packages/rtdf/**
      - packages/vtdf/**
      - bun.lock
      - package.json
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@any-tdf/stdf-site'
            domain: stdf.dev
            artifact: stdf-site
            output: apps/stdf-site/build
          - package: '@any-tdf/rtdf-site'
            domain: rtdf.dev
            artifact: rtdf-site
            output: apps/rtdf-site/dist
          - package: '@any-tdf/vtdf-site'
            domain: vtdf.dev
            artifact: vtdf-site
            output: apps/vtdf-site/dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bunx turbo run build --filter=${{ matrix.package }}

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
